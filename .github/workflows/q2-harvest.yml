name: q2-harvest

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/q2-harvest.yml"

permissions:
  contents: read

jobs:
  harvest-all-public-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q "kagglehub>=1.0.1" "numpy>=1.26" requests
      - name: Materialize exact harvester
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = """"""
          Path("q2_harvest_full.py").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python -m py_compile q2_harvest_full.py
      - name: Parse, validate, blend, and revalidate all versions
        shell: bash
        run: |
          set -o pipefail
          python q2_harvest_full.py --out-dir q2_result --work-dir q2_work --workers 6 2>&1 | tee q2_run.log
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-all-versions-result
          path: |
            q2_result/
            q2_run.log
            q2_harvest_full.py
          if-no-files-found: warn
          retention-days: 1
