name: IHES Kaggle dataset recovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-kaggle-datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe immutable Kaggle dataset IDs and public API
        shell: bash
        run: |
          set -u
          mkdir -p recovered/probes recovered/downloads

          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          out = Path('recovered/probes')
          urls = {
              'dataset_page_7439288': 'https://www.kaggle.com/datasets/7439288',
              'dataset_v1_7439288': 'https://www.kaggle.com/api/v1/datasets/7439288',
              'dataset_list_search': 'https://www.kaggle.com/api/v1/datasets/list?search=cayleypy-submissions',
              'guessed_view': 'https://www.kaggle.com/api/v1/datasets/view/alexandervc/cayleypy-submissions',
              'guessed_page': 'https://www.kaggle.com/datasets/alexandervc/cayleypy-submissions',
          }
          for name, url in urls.items():
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/html,*/*'})
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      body = r.read()
                      meta = {'requested_url':url,'final_url':r.geturl(),'status':r.status,'headers':dict(r.headers),'size':len(body)}
              except urllib.error.HTTPError as e:
                  body = e.read()
                  meta = {'requested_url':url,'final_url':e.geturl(),'status':e.code,'headers':dict(e.headers),'size':len(body)}
              except Exception as e:
                  body = repr(e).encode()
                  meta = {'requested_url':url,'error':repr(e),'size':len(body)}
              (out/f'{name}.meta.json').write_text(json.dumps(meta,indent=2,sort_keys=True))
              (out/f'{name}.body').write_bytes(body)
              print(name,meta)
          PY

          for ref in \
            alexandervc/cayleypy-submissions \
            cayleypy/cayleypy-submissions \
            alexandervc/cayleypy-submission; do
            owner="${ref%%/*}"
            slug="${ref##*/}"
            target="recovered/downloads/${owner}__${slug}.bin"
            code="$(curl -L -A 'Mozilla/5.0' -sS -w '%{http_code}' \
              -o "${target}" \
              "https://www.kaggle.com/api/v1/datasets/download/${owner}/${slug}" || true)"
            printf '%s\t%s\t%s\n' "${ref}" "${code}" "$(wc -c < "${target}" 2>/dev/null || echo 0)" | tee -a recovered/downloads/status.tsv
            file "${target}" | tee -a recovered/downloads/filetypes.txt
          done

      - name: Upload Kaggle recovery probes
        uses: actions/upload-artifact@v4
        with:
          name: ihes-kaggle-dataset-recovery
          path: recovered
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
